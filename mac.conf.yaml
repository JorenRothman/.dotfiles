- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- link:
    ~/.Brewfile: mac/Brewfile
    ~/.zshenv: mac/zsh/zshenv
    ~/.zshrc: mac/zsh/zshrc
    ~/.aerospace.toml: mac/aerospace.toml
    ~/.config/zsh/config.d/mac/:
      glob: true
      clean: true
      path: mac/zsh/config.d/*
    ~/.config/borders/bordersrc:
      path: mac/borders/bordersrc
    "~/Library/Application Support/VSCodium/User/settings.json": shared/vscodium/settings.json
    "~/Library/Application Support/VSCodium/User/keybindings.json": shared/vscodium/keybindings.json
    "~/Library/Application Support/VSCodium/User/snippets/":
      glob: true
      path: shared/vscodium/snippets/*
