- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- link:
    ~/.zshenv: linux/zsh/zshenv
    ~/.zshrc: linux/zsh/zshrc
    ~/.config/zsh/config.d/linux/:
      glob: true
      clean: true
      path: linux/zsh/config.d/*
    ~/.config/quickshell: linux/quickshell
    ~/.config/hypr:
      glob: true
      path: linux/hypr/*
    ~/.config/systemd/user/:
      glob: true
      path: linux/systemd/*
    ~/.config/hypr/:
      glob: true
      path: linux/hyprlock/*
    ~/.config/VSCodium/User/settings.json: shared/vscodium/settings.json
    ~/.config/VSCodium/User/keybindings.json: shared/vscodium/keybindings.json
    ~/.config/VSCodium/User/snippets/:
      glob: true
      path: shared/vscodium/snippets/*

- shell:
    - [systemctl --user daemon-reload, Reload systemd user units]
    - [systemctl --user enable --now vpn-notify.timer, Enable VPN notify timer]
    - [systemctl --user enable --now pnpm-dedupe.timer, Enable weekly pnpm store dedupe]
