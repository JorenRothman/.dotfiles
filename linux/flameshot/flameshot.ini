[General]
; Theme: match Hyprland border / quickshell accent
uiColor=#ff69b4
contrastUiColor=#1e1f26
drawColor=#ff69b4
contrastOpacity=90

; Capture behaviour
savePath=/home/joren/Pictures/Screenshots
savePathFixed=false
filenamePattern=%F_%H-%M-%S
saveAsFileExtension=png
copyOnDoubleClick=true
copyPathAfterSave=false
saveAfterCopy=false
useJpgForClipboard=false

; Quiet daemon: launched on demand by keybind, no tray icon / popups
disabledTrayIcon=true
showStartupLaunchMessage=false
showHelp=false
showDesktopNotification=true
startupLaunch=false
